name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install
        run: python -m pip install .
      - name: Smoke test (start the server and read the API)
        run: |
          export JOBWATCH_HOME="$RUNNER_TEMP/jobwatch"
          jobwatch serve --port 8799 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8799/api/state && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/api/state | python -c "import json,sys; s=json.load(sys.stdin); assert 'jobs' in s and s['memory']['total'] > 0; print('ok')"
          curl -sf http://127.0.0.1:8799/ | grep -q "<title>Jobwatch</title>"
