[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobwatch"
dynamic = ["version"]
description = "A local dashboard for long-running Python jobs on macOS: RAM, CPU, live logs, progress and a time-left estimate learned from earlier runs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Halim Kiraz" }]
keywords = ["monitoring", "dashboard", "machine-learning", "training", "progress", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kirazhalim/jobwatch"
Issues = "https://github.com/kirazhalim/jobwatch/issues"

[project.scripts]
jobwatch = "jobwatch.cli:main"

[tool.setuptools]
packages = ["jobwatch", "jobwatch.demo"]

[tool.setuptools.package-data]
jobwatch = ["static/*.html"]

[tool.setuptools.dynamic]
version = { attr = "jobwatch.__version__" }
